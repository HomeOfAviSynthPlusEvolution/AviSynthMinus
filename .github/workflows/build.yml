name: Test builds

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-core:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 26.04 x64
            runner: ubuntu-26.04
            family: linux
            artifact_name: avisynth-ubuntu-26.04-x64
            artifact_path: stage/**/*.so*
          - name: macOS 15 Apple Silicon arm64
            runner: macos-15
            family: macos
            artifact_name: avisynth-macos-15-arm64
            artifact_path: stage/**/*.dylib
          - name: Windows VS2026 x86
            runner: windows-2025-vs2026
            family: windows
            architecture: Win32
            artifact_name: avisynth-windows-vs2026-x86
            artifact_path: stage/**/*.dll
          - name: Windows VS2026 x64
            runner: windows-2025-vs2026
            family: windows
            architecture: x64
            artifact_name: avisynth-windows-vs2026-x64
            artifact_path: stage/**/*.dll

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Iris dependencies
        uses: ./.github/actions/iris-dependencies
        with:
          architecture: ${{ matrix.architecture || 'x64' }}

      - name: Configure (POSIX)
        if: matrix.family == 'linux' || matrix.family == 'macos'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DENABLE_TESTS=OFF \
            -DENABLE_PLUGINS=OFF \
            -DENABLE_CUDA=OFF -DIRIS_LLVM=${{ env.IRIS_LLVM }} -DIRIS_SLEEF=${{ env.IRIS_SLEEF }}

      - name: Configure (Windows)
        if: matrix.family == 'windows'
        shell: pwsh
        run: >
          cmake -S . -B build -G "Visual Studio 18 2026"
          -A ${{ matrix.architecture }} -T v145
          -DBUILD_SHARED_LIBS=ON
          -DENABLE_TESTS=OFF
          -DENABLE_PLUGINS=OFF
          -DENABLE_CUDA=OFF -DIRIS_LLVM=${{ env.IRIS_LLVM }} -DIRIS_SLEEF=${{ env.IRIS_SLEEF }}

      - name: Build (POSIX)
        if: matrix.family == 'linux' || matrix.family == 'macos'
        shell: bash
        run: cmake --build build --parallel

      - name: Build (Windows)
        if: matrix.family == 'windows'
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Stage shared library (POSIX)
        if: matrix.family == 'linux' || matrix.family == 'macos'
        shell: bash
        run: cmake --install build --prefix "$PWD/stage"

      - name: Stage shared library (Windows)
        if: matrix.family == 'windows'
        shell: pwsh
        run: cmake --install build --config Release --prefix "$PWD/stage"

      - name: Verify shared library (Linux)
        if: matrix.family == 'linux'
        shell: bash
        run: |
          find stage -type f -name 'libavisynth.so*' -print
          test -n "$(find stage -type f -name 'libavisynth.so*' -print -quit)"

      - name: Verify shared library (macOS)
        if: matrix.family == 'macos'
        shell: bash
        run: |
          find stage -type f -name 'libavisynth*.dylib' -print
          test -n "$(find stage -type f -name 'libavisynth*.dylib' -print -quit)"

      - name: Verify shared library (Windows)
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path stage -Filter AviSynth.dll -Recurse -File
          if (-not $dll) { throw 'AviSynth.dll was not installed.' }
          $dll | Select-Object -ExpandProperty FullName

      - name: Configure shared API tests (POSIX)
        if: matrix.family == 'linux' || matrix.family == 'macos'
        shell: bash
        run: cmake -S tests/shared_api -B build/shared-api -G Ninja -DCMAKE_BUILD_TYPE=Release -DAVS_INSTALL_PREFIX="$PWD/stage" -DAVS_TEST_IRIS=ON -DAVS_TEST_IRIS_LLVM=${{ env.IRIS_LLVM }} -DAVS_TEST_IRIS_SLEEF=${{ env.IRIS_SLEEF }}

      - name: Configure shared API tests (Windows)
        if: matrix.family == 'windows'
        shell: pwsh
        run: cmake -S tests/shared_api -B build/shared-api -G "Visual Studio 18 2026" -A ${{ matrix.architecture }} -T v145 -DAVS_INSTALL_PREFIX="$PWD/stage" -DAVS_TEST_IRIS=ON -DAVS_TEST_IRIS_LLVM=${{ env.IRIS_LLVM }} -DAVS_TEST_IRIS_SLEEF=${{ env.IRIS_SLEEF }}

      - name: Build shared API tests
        run: cmake --build build/shared-api --config Release --parallel

      - name: Run shared API tests
        run: ctest --test-dir build/shared-api -C Release --output-on-failure --timeout 120

      - name: Upload shared library
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  regression:
    name: Regression / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Linux x64 (legacy Intel SIMD off), runner: ubuntu-26.04, architecture: x64, cmake_options: '-DENABLE_INTEL_SIMD=OFF'}
          - {name: macOS ARM64, runner: macos-15, architecture: arm64}
          - {name: Windows x64, runner: windows-2025-vs2026, architecture: x64}
          - {name: Windows x86, runner: windows-2025-vs2026, architecture: Win32}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install Iris dependencies
        uses: ./.github/actions/iris-dependencies
        with:
          architecture: ${{ matrix.architecture || 'x64' }}

      - name: Configure (POSIX)
        if: runner.os != 'Windows'
        run: cmake -S . -B build/regression -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DENABLE_TESTS=ON -DENABLE_PLUGINS=OFF -DENABLE_CUDA=OFF -DIRIS_LLVM=${{ env.IRIS_LLVM }} -DIRIS_SLEEF=${{ env.IRIS_SLEEF }} ${{ matrix.cmake_options }}
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build/regression -G "Visual Studio 18 2026" -A ${{ matrix.architecture }} -T v145 -DBUILD_SHARED_LIBS=OFF -DENABLE_TESTS=ON -DENABLE_PLUGINS=OFF -DENABLE_CUDA=OFF -DIRIS_LLVM=${{ env.IRIS_LLVM }} -DIRIS_SLEEF=${{ env.IRIS_SLEEF }}
      - name: Build
        run: cmake --build build/regression --config Release --parallel
      - name: Test
        run: ctest --test-dir build/regression -C Release --output-on-failure --parallel 2 --timeout 180
